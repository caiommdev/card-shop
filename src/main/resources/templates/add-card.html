<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Card</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Add Card</h1>

    <form action="#" th:action="@{/add}" th:object="${card}" method="post" class="mt-3" id="addCardForm">
        <!-- Validation Error Alert -->
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger alert-dismissible fade show" role="alert" id="validation-alert">
            <strong>Validation Error!</strong> Please correct the following errors:
            <ul class="mb-0 mt-2">
                <li th:each="err : ${#fields.detailedErrors()}" th:text="${err.message}"></li>
            </ul>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <div class="form-group">
            <label for="name">Name: <span class="text-danger">*</span></label>
            <input type="text" th:field="*{name}" id="name" class="form-control" th:errorclass="is-invalid"
                   required minlength="1" maxlength="255">
            <div class="invalid-feedback" th:classappend="${#fields.hasErrors('name')} ? 'd-block' : ''"
                 th:text="${#fields.hasErrors('name')} ? ${#fields.errors('name')[0]} : 'Name is mandatory'"></div>
        </div>
        <div class="form-group">
            <label for="description">Description: <span class="text-danger">*</span></label>
            <input type="text" th:field="*{description}" id="description" class="form-control" th:errorclass="is-invalid"
                   required minlength="1" maxlength="500">
            <div class="invalid-feedback" th:classappend="${#fields.hasErrors('description')} ? 'd-block' : ''"
                 th:text="${#fields.hasErrors('description')} ? ${#fields.errors('description')[0]} : 'Description is mandatory'"></div>
        </div>
        <div class="form-group">
            <label for="price">Price: <span class="text-danger">*</span></label>
            <input type="number" step="0.01" th:field="*{price}" id="price" class="form-control" th:errorclass="is-invalid"
                   required min="0.01" max="999999.99">
            <div class="invalid-feedback" th:classappend="${#fields.hasErrors('price')} ? 'd-block' : ''"
                 th:text="${#fields.hasErrors('price')} ? ${#fields.errors('price')[0]} : 'Price must be positive'"></div>
        </div>
        <input type="submit" value="Add Card" class="btn btn-primary" id="submitBtn">
        <a href="/" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Client-side form validation
    (function() {
        'use strict';

        var form = document.getElementById('addCardForm');
        var submitBtn = document.getElementById('submitBtn');
        var nameInput = document.getElementById('name');
        var descriptionInput = document.getElementById('description');
        var priceInput = document.getElementById('price');

        function validateForm() {
            var isValid = true;

            // Validate name (not empty, not just whitespace)
            if (!nameInput.value || nameInput.value.trim() === '') {
                isValid = false;
            }

            // Validate description (not empty, not just whitespace)
            if (!descriptionInput.value || descriptionInput.value.trim() === '') {
                isValid = false;
            }

            // Validate price (positive number)
            var price = parseFloat(priceInput.value);
            if (!priceInput.value || isNaN(price) || price <= 0) {
                isValid = false;
            }

            // Enable or disable submit button
            submitBtn.disabled = !isValid;

            return isValid;
        }

        // Validate on input change
        nameInput.addEventListener('input', validateForm);
        descriptionInput.addEventListener('input', validateForm);
        priceInput.addEventListener('input', validateForm);
        priceInput.addEventListener('change', validateForm);

        // Initial validation on page load
        validateForm();

        // Prevent form submission if invalid
        form.addEventListener('submit', function(event) {
            if (!validateForm()) {
                event.preventDefault();
                event.stopPropagation();
                return false;
            }
        });
    })();
</script>
</body>
</html>
