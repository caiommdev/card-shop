<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Card</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Add Card</h1>
    <form action="#" th:action="@{/add}" th:object="${card}" method="post" class="mt-3">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" th:field="*{name}" id="name" class="form-control" th:errorclass="is-invalid">
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"></div>
        </div>
        <div class="form-group">
            <label for="description">Description:</label>
            <input type="text" th:field="*{description}" id="description" class="form-control" th:errorclass="is-invalid">
            <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="invalid-feedback"></div>
        </div>
        <div class="form-group">
            <label for="price">Price:</label>
            <input type="number" step="0.01" th:field="*{price}" id="price" class="form-control" th:errorclass="is-invalid">
            <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="invalid-feedback"></div>
        </div>
        <input type="submit" value="Add Card" class="btn btn-primary">
        <a href="/" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
