name: CI/CD Pipeline with Security Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  # Build e Testes Unitários
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necessário para CodeQL

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean compile

    - name: Run Unit Tests
      run: mvn -B test -Dtest=!*Selenium*

    - name: Package Application
      run: mvn -B package -DskipTests

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
        retention-days: 30

  # SAST - CodeQL Analysis
  sast-codeql:
    name: SAST - CodeQL Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java
        queries: security-and-quality

    - name: Build for CodeQL
      run: mvn -B clean compile -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java"


  # Deploy Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, sast-codeql]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/

    - name: Deploy to Staging
      env:
        DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        DB_HOST: ${{ vars.STAGING_DB_HOST }}
      run: |
        echo "🚀 Deploying to Staging"
        echo "JAR: $(ls -1 target/*.jar)"
        echo "Database: ${DB_HOST}"
        echo "✅ Artifact ready for deployment"
        # Aqui você pode adicionar o comando real de deploy
        # Exemplo: scp target/*.jar user@staging-server:/app/
        # ou usar outro método de deploy que preferir

  # Testes Selenium Pós-Deploy
  selenium-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cardshop
          POSTGRES_USER: cardshop
          POSTGRES_PASSWORD: cardshop
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/

    - name: Install Firefox
      run: |
        sudo apt-get update
        sudo apt-get install -y firefox

    - name: Start Application
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cardshop
        SPRING_DATASOURCE_USERNAME: cardshop
        SPRING_DATASOURCE_PASSWORD: cardshop
      run: |
        echo "🚀 Starting application..."
        java -jar target/*.jar &
        APP_PID=$!
        echo "APP_PID=$APP_PID" >> $GITHUB_ENV

    - name: Wait for Application
      run: |
        echo "⏳ Waiting for application..."
        timeout 120 bash -c 'until curl -f http://localhost:8080/actuator/health; do sleep 5; done'
        echo "✅ Application is ready"

    - name: Run Selenium Tests
      run: mvn test -Dtest=*Selenium* -Dselenium.base.url=http://localhost:8080

    - name: Stop Application
      if: always()
      run: |
        if [ ! -z "$APP_PID" ]; then
          kill $APP_PID || true
        fi

    - name: Upload Selenium Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: selenium-results
        path: target/surefire-reports/
        retention-days: 30

  # DAST - Análise de Segurança Dinâmica
  dast-zap:
    name: DAST - OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cardshop
          POSTGRES_USER: cardshop
          POSTGRES_PASSWORD: cardshop
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/

    - name: Start Application
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cardshop
        SPRING_DATASOURCE_USERNAME: cardshop
        SPRING_DATASOURCE_PASSWORD: cardshop
      run: |
        echo "🚀 Starting application..."
        java -jar target/*.jar &
        APP_PID=$!
        echo "APP_PID=$APP_PID" >> $GITHUB_ENV

    - name: Wait for Application
      run: |
        echo "⏳ Waiting for application..."
        timeout 120 bash -c 'until curl -f http://localhost:8080/actuator/health; do sleep 5; done'
        echo "✅ Application is ready"

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8080'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        fail_action: false

    - name: Stop Application
      if: always()
      run: |
        if [ ! -z "$APP_PID" ]; then
          kill $APP_PID || true
        fi

    - name: Upload ZAP Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: zap-scan-report
        path: report_html.html
        retention-days: 30

  # Deploy Production (com aprovação manual)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [selenium-tests, dast-zap]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/

    - name: Deploy to Production
      env:
        DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        DB_HOST: ${{ vars.PROD_DB_HOST }}
      run: |
        echo "🚀 Deploying to Production"
        echo "JAR: $(ls -1 target/*.jar)"
        echo "Database: ${DB_HOST}"
        echo "✅ Artifact ready for production deployment"
        # Aqui você pode adicionar o comando real de deploy
        # Exemplo: scp target/*.jar user@production-server:/app/
        # ou usar outro método de deploy que preferir

